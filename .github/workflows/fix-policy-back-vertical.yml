name: Fix policy back vertical
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-policy-back-vertical.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply desktop-only vertical alignment fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('privacy.html')
          s = p.read_text(encoding='utf-8')
          marker = '.policy-back:hover{color:var(--text)}'
          addition = marker + '@media(min-width:761px){.policy-back{transform:translateY(17px)}}'
          if 'transform:translateY(17px)' not in s:
              if marker not in s:
                  raise SystemExit('Expected marker not found')
              s = s.replace(marker, addition, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit privacy.html and remove installer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add privacy.html
          git commit -m 'Align policy back link on desktop' || true
          git rm .github/workflows/fix-policy-back-vertical.yml
          git commit -m 'Remove one-time policy alignment installer'
          git push
