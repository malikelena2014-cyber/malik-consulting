name: Install Yandex Metrika

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Insert Metrika counter into site pages
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import re

          snippet = base64.b64decode('').decode('utf-8')

          changed = []
          for filename in ('index.html', 'privacy.html'):
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              if '112547387' in text:
                  continue
              match = re.search(r'<body\b[^>]*>', text, flags=re.IGNORECASE)
              if not match:
                  raise RuntimeError(f'Opening <body> tag not found in {filename}')
              text = text[:match.end()] + '\n' + snippet + '\n' + text[match.end():]
              path.write_text(text, encoding='utf-8')
              changed.append(filename)

          print('Updated:', ', '.join(changed) if changed else 'nothing')
          PY

      - name: Commit updated pages
        shell: bash
        run: |
          if git diff --quiet -- index.html privacy.html; then
            echo "Metrika already installed; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html privacy.html
          git commit -m "Install Yandex Metrika counter 112547387"
          git push
