name: Remove policy back border

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-policy-back-border.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove only lilac underline from policy back link
        shell: python
        run: |
          from pathlib import Path
          p = Path('privacy.html')
          s = p.read_text(encoding='utf-8')
          old = ".policy-back{font-size:14px;color:var(--muted);border-bottom:1px solid var(--accent);padding-bottom:5px}"
          new = ".policy-back{font-size:14px;color:var(--muted);padding-bottom:5px}"
          if old not in s:
              raise SystemExit('Expected policy-back CSS not found; refusing to change anything.')
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one match, found {s.count(old)}; refusing to change anything.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - name: Commit privacy.html and remove installer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add privacy.html
          git rm .github/workflows/remove-policy-back-border.yml
          git commit -m "Remove extra underline from policy back link"
          git push
