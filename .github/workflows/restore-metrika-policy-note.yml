name: Restore agreed Metrika policy note
on:
  push:
    paths:
      - '.github/workflows/restore-metrika-policy-note.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore only agreed analytics disclosure
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('privacy.html')
          s = p.read_text(encoding='utf-8')
          old = '<div class="policy-note"><p>Если в дальнейшем на сайте будет подключена система веб-аналитики, Оператор актуализирует настоящий раздел и при необходимости размещает отдельное уведомление об использовании файлов cookie.</p></div>'
          new = '<div class="policy-note"><p>Для анализа посещаемости сайта используется сервис Яндекс Метрика, счётчик №112547387. В настройках счётчика включена опция «Не сохранять полные IP-адреса посетителей сайта». Сервис может автоматически получать технические сведения о посещении сайта, включая данные браузера и устройства, источник перехода, просмотренные страницы и иные технические идентификаторы, необходимые для веб-аналитики.</p></div>'
          if old not in s:
              raise SystemExit('Expected old analytics note not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit privacy.html and remove installer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add privacy.html
          git commit -m "Restore Yandex Metrika privacy disclosure"
          git rm .github/workflows/restore-metrika-policy-note.yml
          git commit -m "Remove one-time Metrika policy installer"
          git push
