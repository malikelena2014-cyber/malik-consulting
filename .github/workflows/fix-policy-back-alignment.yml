name: Fix policy back alignment
on:
  push:
    paths:
      - '.github/workflows/fix-policy-back-alignment.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove leftover padding from policy back link
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('privacy.html')
          s = p.read_text(encoding='utf-8')
          old = '.policy-back{font-size:14px;color:var(--muted);padding-bottom:5px}'
          new = '.policy-back{font-size:14px;color:var(--muted)}'
          if old not in s:
              raise SystemExit('Expected policy-back rule not found')
          s2 = s.replace(old, new, 1)
          p.write_text(s2, encoding='utf-8')
          PY
      - name: Commit privacy.html and remove installer
        run: |
          git config user.name "malikelena2014-cyber"
          git config user.email "malikelena2014@gmail.com"
          git add privacy.html
          git commit -m "Align policy back link after underline removal"
          git rm .github/workflows/fix-policy-back-alignment.yml
          git commit -m "Remove one-time policy alignment workflow"
          git push
