name: Fix mobile policy link and favicon
on:
  push:
    paths:
      - '.github/workflows/fix-mobile-policy-and-favicon.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply only requested fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('privacy.html')
          s = p.read_text(encoding='utf-8')
          old = '.policy-back{font-size:12px}}</style>'
          new = '.policy-back{font-size:12px;transform:translateY(13px)}}</style>'
          if old not in s:
              raise SystemExit('Expected mobile policy-back rule not found')
          s = s.replace(old, new, 1)
          if 'href="/favicon.svg?v=2"' not in s:
              marker = '<title>Политика обработки персональных данных — Елена Малик</title>'
              if marker not in s:
                  raise SystemExit('Privacy title marker not found')
              s = s.replace(marker, marker + '<link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">', 1)
          p.write_text(s, encoding='utf-8')

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<link rel="icon" href="favicon.svg" type="image/svg+xml">'
          new = '<link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">'
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('Expected favicon link not found in index.html')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit files and remove installer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html privacy.html
          git commit -m "Fix mobile policy link and refresh favicon" || true
          git rm .github/workflows/fix-mobile-policy-and-favicon.yml
          git commit -m "Remove one-time mobile/favicon installer"
          git push
