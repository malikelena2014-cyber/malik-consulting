name: Add SEO metadata

on:
  push:
    paths:
      - '.github/workflows/add-seo-metadata.yml'

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add canonical, social metadata and favicon
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = '<link rel="stylesheet" href="style.css">'
          block = '''<link rel="canonical" href="https://malik-consulting.ru/">
          <meta property="og:type" content="website">
          <meta property="og:locale" content="ru_RU">
          <meta property="og:site_name" content="Елена Малик — финансовый директор">
          <meta property="og:title" content="Елена Малик — ясные финансы для вашего бизнеса">
          <meta property="og:description" content="Финансовый директор на аутсорсе. Управленческий учет, финансовые модели и аналитика маркетплейсов. Бесплатная диагностика бизнеса за 60 минут.">
          <meta property="og:url" content="https://malik-consulting.ru/">
          <meta property="og:image" content="https://malik-consulting.ru/assets/elena-city.jpg">
          <meta property="og:image:alt" content="Елена Малик — финансовый директор на аутсорсе">
          <meta name="twitter:card" content="summary_large_image">
          <meta name="twitter:title" content="Елена Малик — ясные финансы для вашего бизнеса">
          <meta name="twitter:description" content="Финансовый директор на аутсорсе. Управленческий учет, финансовые модели и аналитика маркетплейсов.">
          <meta name="twitter:image" content="https://malik-consulting.ru/assets/elena-city.jpg">
          <link rel="icon" href="favicon.svg" type="image/svg+xml">
          '''

          if 'rel="canonical" href="https://malik-consulting.ru/"' not in text:
              if marker not in text:
                  raise SystemExit('Stylesheet marker not found')
              text = text.replace(marker, block + marker, 1)
              path.write_text(text, encoding='utf-8')

      - name: Commit changes and remove installer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/add-seo-metadata.yml
          git commit -m "Add SEO metadata and favicon link"
          git push
