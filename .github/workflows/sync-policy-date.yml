name: Sync policy date
on:
  push:
    paths:
      - '.github/workflows/sync-policy-date.yml'
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Sync policy date only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('privacy.html')
          s=p.read_text(encoding='utf-8')
          old='Редакция от 12 сентября 2026 года'
          new='Редакция от 13 сентября 2026 года'
          if old not in s:
              raise SystemExit('Expected old date not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit privacy.html and remove installer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add privacy.html
          git commit -m "Sync privacy policy date" || true
          git rm .github/workflows/sync-policy-date.yml
          git commit -m "Remove one-time policy date installer"
          git push
